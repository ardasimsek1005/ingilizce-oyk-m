name: Keep Render Server Awake

on:
  schedule:
    # Run every 10 minutes to prevent the free-tier Render server from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://ingilizce-oyk-m.onrender.com/api/health
