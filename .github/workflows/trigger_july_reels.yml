name: Trigger Daily July Reels Post

on:
  schedule:
    # Trigger every 30 minutes between 1:00 PM and 3:00 PM Turkey Time (10:00 to 12:00 UTC)
    # This frequent trigger ensures the Reel is posted daily even if GitHub's scheduler is heavily delayed.
    # The API contains built-in double-posting protection and will execute exactly once per day.
    - cron: '*/30 10-12 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger_july_reel:
    runs-on: ubuntu-latest
    steps:
      - name: Send Reels API Request to Render Server
        run: |
          curl -i -X POST \
            --connect-timeout 60 \
            --retry 3 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.INSTAGRAM_ADMIN_SECRET || 'ingilizceoykum_secret_admin_123' }}" \
            "https://ingilizce-oyk-m.onrender.com/api/instagram/trigger-july-reel"
